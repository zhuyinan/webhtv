name: Build webhtv APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Verify bundled MPV native assets
        run: bash scripts/verify_mpv_native_assets.sh --require-elf
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build leanback armv7 debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleLeanbackArmeabi_v7aDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-apk
          path: app/build/outputs/apk/leanback/*eabi_v7a/debug/*.apk
