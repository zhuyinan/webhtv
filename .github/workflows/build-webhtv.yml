name: Build webhtv (debug)
on:
  push:
    branches: [main, zhu/release-base]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - name: Verify native assets
        run: bash scripts/verify_mpv_native_assets.sh --require-elf
      - name: Build leanback armv7 debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleLeanbackArmeabi_v7aDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-apk
          path: app/build/outputs/apk/**/*.apk
